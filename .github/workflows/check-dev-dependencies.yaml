name: "Check devDependencies"

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  check_deps:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Project
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Check devDependencies
      run: npm ls --depth=0
